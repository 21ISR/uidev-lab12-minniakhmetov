<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://gist.githubusercontent.com/ktkv419/c8840dfcbcff24248c20f4199108b28e/raw/eec499022cca5ed984d91d2a2c2736d2aef8ed6d/reset.css">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <header>
            <h1>Student register</h1>
            <p>Create your student account</p>
        </header>
        <main>
            <form action="/api/login" metod="post">

                <label class="form__header" for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">

                <label class="form__header" for="email">Email address</label>
                <input type="text" id="email" name="email" placeholder="Enter your email">

                <label class="form__header" for="studentId">Student ID</label>
                <input type="text" id="studentId" name="studentId" placeholder="Enter your Student ID">
                <label class="form__header">Select Program</label>
                <select>
                    <option value="value1" disabled selected>Choose your program</option>
                    <option value="value1">Computer Science</option>
                    <option value="value1">Engineering</option>
                    <option value="value2">Business</option>
                    <option value="value3">Arts & Humanities</option>
                    <option value="value4">Science</option>
                  </select>
                  <label class="form__header" for="password">Password</label>
                  <input type="text" id="password" name="password" placeholder="Enter your password">
                  <label class="form__header" for="password">Confirm Password</label>
                  <input type="text" id="password" name="password" placeholder="Confirm password!">
                <div id="remember__me" class="inline">
                    <input type="checkbox" id="RememberMe" name="remember">
                    <label id="remember" for="RememberMe"> i agree to the Terms of service and sell my soul</label>
                    
                </div>

                <input id="submit__btn" type="submit" value="Register">
            </form>

            <div id="register__link" class="inline"><span>Already have account?</span><a
                    style="margin-inline-start: 5%;" href="./index.html">log in</a></div>
        </main>

        <footer></footer>
    </div>

</body>

</html>
